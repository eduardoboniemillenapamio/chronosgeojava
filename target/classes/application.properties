# --------------- Datasource Oracle -------------------------
# Alterar usuario, password e jdbc-url conforme credenciais
# fornecidas pelo professor da FIAP.
# Em producao (Railway/Render) usar variaveis de ambiente:
#   QUARKUS_DATASOURCE_USERNAME
#   QUARKUS_DATASOURCE_PASSWORD
#   QUARKUS_DATASOURCE_JDBC_URL
quarkus.datasource.db-kind=oracle
quarkus.datasource.username=rm566664
quarkus.datasource.password=fiap2026
quarkus.datasource.jdbc.url=jdbc:oracle:thin:@oracle.fiap.com.br:1521:orcl

# Pool de conexoes
quarkus.datasource.jdbc.min-size=2
quarkus.datasource.jdbc.max-size=10

# --------------- JPA / Hibernate ---------------------------
# none: nao altera o schema (tabelas ja criadas pelo gs_database.sql)
# validate: valida o mapeamento — usar em producao apos confirmar tabelas ok
quarkus.hibernate-orm.database.generation=none
quarkus.hibernate-orm.log.sql=false
quarkus.hibernate-orm.physical-naming-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# --------------- HTTP / Porta ------------------------------
quarkus.http.port=8080

# --------------- CORS (Quarkus 3.x) -----------------------
# Permite que o Front-End (Vercel) consuma esta API.
# No Quarkus 3.x a sintaxe de origins mudou para quarkus.http.cors.origins/*
quarkus.http.cors=true
quarkus.http.cors.origins=/.*/
quarkus.http.cors.methods=GET,POST,PUT,DELETE,PATCH,OPTIONS,HEAD
quarkus.http.cors.headers=accept,authorization,content-type,x-requested-with
quarkus.http.cors.exposed-headers=location,info
quarkus.http.cors.access-control-max-age=24H
quarkus.http.cors.access-control-allow-credentials=false

# --------------- Jackson / JSON ----------------------------
quarkus.jackson.serialization-inclusion=non-null
quarkus.jackson.write-dates-as-timestamps=false

# --------------- Logging -----------------------------------
quarkus.log.level=INFO
quarkus.log.category."br.com.chronosgeo".level=DEBUG
